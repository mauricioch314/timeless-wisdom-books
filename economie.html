<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Économie — Timeless Wisdom Books</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #C9A84C; --muted: #6b6b6b; --font: 'Cormorant Garamond', Georgia, serif; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      background: #fff;
      color: #1a1a1a;
      text-align: center;
    }
    .brand { font-size: clamp(11px, 1.5vw, 13px); letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: clamp(26px, 5vw, 42px); font-weight: 300; letter-spacing: 0.12em; }
    .divider { width: 32px; height: 1px; background: var(--accent); }
    .soon {
      font-size: clamp(11px, 1.5vw, 13px); letter-spacing: 0.20em;
      text-transform: uppercase; color: var(--muted);
    }
    a.back {
      margin-top: 1rem;
      font-size: 13px; letter-spacing: 0.08em;
      color: var(--muted); text-decoration: none;
      border-bottom: 1px solid #e8e4dc; padding-bottom: 2px;
      transition: color 180ms ease, border-color 180ms ease;
    }
    a.back:hover { color: #1a1a1a; border-color: var(--accent); }
  </style>
</head>
<body>
  <p class="brand">Timeless Wisdom Books</p>
  <h1>Économie</h1>
  <div class="divider"></div>
  <p class="soon">Sitio en construcción &nbsp;·&nbsp; Under construction &nbsp;·&nbsp; Site en construction</p>
  <a class="back" href="/">← Accueil</a>
</body>
</html>

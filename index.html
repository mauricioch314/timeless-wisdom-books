<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeless Wisdom Books</title>
  <meta name="description" content="Ancient wisdom for the modern seeker. A curated collection of novels, spirituality, and philosophy.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-bg:           #ffffff;
      --color-text:         #1a1a1a;
      --color-text-muted:   #6b6b6b;
      --color-accent:       #C9A84C;
      --color-accent-hover: #B8933A;
      --font-display:       'Cormorant Garamond', Georgia, serif;
      --comp-size:          min(520px, 88vw, 60vh);
      --flag-orbit:         0.277;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-display);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(0.75rem, 2.5vh, 2rem) 1rem;
      gap: 0;
    }

    /* ── Brand name ───────────────────────────────────────────── */
    .brand-name {
      font-size: clamp(20px, 3.8vw, 32px);
      font-weight: 300;
      letter-spacing: 0.20em;
      text-align: center;
      color: var(--color-text);
      margin-bottom: 0.3rem;
      line-height: 1.3;
    }

    .brand-tagline {
      font-size: clamp(11px, 1.6vw, 14px);
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      text-align: center;
      margin-bottom: clamp(0.75rem, 3vh, 2rem);
      transition: opacity 350ms ease;
    }
    .brand-tagline.fading { opacity: 0; }

    /* ── Composition ──────────────────────────────────────────── */
    .composition {
      position: relative;
      width: var(--comp-size);
      height: var(--comp-size);
      flex-shrink: 0;
    }

    /* ── Spiral SVG ───────────────────────────────────────────── */
    .spiral-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      animation: spiral-enter 800ms ease-out both;
      animation-delay: 500ms;
      transition: opacity 300ms ease-in;
    }
    @keyframes spiral-enter {
      from { opacity: 0; transform: rotate(5deg); }
      to   { opacity: 1; transform: rotate(0deg); }
    }
    .spiral-svg.hidden { opacity: 0; pointer-events: none; animation: none; }
    @media (max-width: 420px) { .spiral-text { display: none; } }

    /* ── Center emblem ────────────────────────────────────────── */
    .emblem {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: calc(var(--comp-size) * 0.36);
      height: calc(var(--comp-size) * 0.36);
      border-radius: 50%;
      background: #faf8f4;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .emblem svg {
      width: 58%;
      height: 58%;
    }

    /* ── Flags ─────────────────────────────────────────────────── */
    .flag {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
      transition: transform 150ms ease, box-shadow 150ms ease;
      z-index: 2;
      padding: 2px;
    }
    .flag:hover { transform: scale(1.12); box-shadow: 0 3px 10px rgba(0,0,0,0.22); }
    .flag:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }
    .flag.active { box-shadow: 0 0 0 2.5px var(--color-accent), 0 1px 6px rgba(0,0,0,0.18); }

    /*
      3 flags at 120° intervals, clockwise from top.
      r = comp-size * 0.277
        0°  → EN  top        sin=0,      cos=1  → (0, -r)
      120°  → FR  lower-right sin=0.866, cos=-0.5 → (0.866r, 0.5r)
      240°  → ES  lower-left  sin=-0.866,cos=-0.5 → (-0.866r, 0.5r)
    */
    .flag-en {
      left: calc(50% - 20px);
      top:  calc(50% - var(--comp-size) * 0.277 - 20px);
    }
    .flag-fr {
      left: calc(50% + var(--comp-size) * 0.240 - 20px);
      top:  calc(50% + var(--comp-size) * 0.139 - 20px);
    }
    .flag-es {
      left: calc(50% - var(--comp-size) * 0.240 - 20px);
      top:  calc(50% + var(--comp-size) * 0.139 - 20px);
    }

    /* Mobile */
    @media (max-width: 480px) {
      .composition { width: 92vw; height: 92vw; }
      .emblem { width: 56vw; height: 56vw; }
      .flag-en { left: calc(46vw - 20px); top: calc(1vw - 20px); }
      .flag-fr { left: calc(84vw - 20px); top: calc(69vw - 20px); }
      .flag-es { left: calc(8vw - 20px);  top: calc(69vw - 20px); }
    }

    /* ── Navigation ───────────────────────────────────────────── */
    .lang-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      margin-top: clamp(0.5rem, 2vh, 1.5rem);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 400ms ease-out 100ms, transform 400ms ease-out 100ms;
    }
    .lang-nav.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .nav-row {
      display: flex;
      align-items: baseline;
      gap: 0;
    }

    .nav-sep {
      font-family: var(--font-display);
      font-size: clamp(13px, 1.8vw, 18px);
      color: var(--color-text-muted);
      padding: 0 0.55em;
      user-select: none;
    }

    .lang-nav a {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(13px, 1.8vw, 18px);
      letter-spacing: 0.10em;
      color: var(--color-text);
      text-decoration: none;
      position: relative;
      padding-bottom: 3px;
    }

    .lang-nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: var(--color-accent);
      transition: width 220ms ease;
    }
    .lang-nav a:hover::after,
    .lang-nav a:focus-visible::after { width: 100%; }
    .lang-nav a:hover { color: var(--color-accent-hover); }
    .lang-nav a:focus-visible { outline: none; color: var(--color-accent-hover); }
    .lang-nav a:visited { color: var(--color-text); }
    .lang-nav a:visited:hover { color: var(--color-accent-hover); }

    @media (max-width: 540px) {
      .lang-nav a, .nav-sep { font-size: clamp(10px, 3vw, 14px); }
      .nav-sep { padding: 0 0.35em; }
    }
  </style>
</head>
<body>

  <h1 class="brand-name">Timeless&nbsp;Wisdom&nbsp;Books</h1>
  <p class="brand-tagline" id="brand-tagline">Ancient wisdom · Timeless collection</p>

  <div class="composition" role="region" aria-label="Language selection — choose your flag">

    <!-- Spiral text -->
    <svg class="spiral-svg" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <defs>
        <path id="text-orbit"
          d="M 280 60
             A 220 220 0 0 1 280 500
             A 220 220 0 0 1 280 60"/>
      </defs>
      <text class="spiral-text" font-family="'Cormorant Garamond', Georgia, serif" font-size="17" fill="#1a1a1a">
        <textPath href="#text-orbit" startOffset="0%" textLength="1382" lengthAdjust="spacing">Welcome to our collection  ·  Bienvenue dans notre collection  ·  Bienvenidos a nuestra colección  ·  </textPath>
      </text>
    </svg>

    <!-- Central emblem: open book icon -->
    <div class="emblem">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Book spine -->
        <line x1="30" y1="13" x2="30" y2="47" stroke="#C9A84C" stroke-width="1.2"/>
        <!-- Left page -->
        <path d="M30 15 C22 13 11 16 9 20 L9 45 C11 41 22 39 30 41" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
        <!-- Right page -->
        <path d="M30 15 C38 13 49 16 51 20 L51 45 C49 41 38 39 30 41" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
        <!-- Left page lines -->
        <line x1="13" y1="25" x2="26" y2="23" stroke="#C9A84C" stroke-width="0.7" opacity="0.55"/>
        <line x1="13" y1="31" x2="26" y2="29" stroke="#C9A84C" stroke-width="0.7" opacity="0.55"/>
        <line x1="13" y1="37" x2="26" y2="35" stroke="#C9A84C" stroke-width="0.7" opacity="0.55"/>
        <!-- Right page lines -->
        <line x1="47" y1="25" x2="34" y2="23" stroke="#C9A84C" stroke-width="0.7" opacity="0.55"/>
        <line x1="47" y1="31" x2="34" y2="29" stroke="#C9A84C" stroke-width="0.7" opacity="0.55"/>
        <line x1="47" y1="37" x2="34" y2="35" stroke="#C9A84C" stroke-width="0.7" opacity="0.55"/>
      </svg>
    </div>

    <!-- 3 flags at 120° intervals -->
    <img class="flag flag-en" src="https://flagcdn.com/w80/gb.png" alt="English" title="English"
      role="button" tabindex="0" data-lang="en" aria-pressed="false">
    <img class="flag flag-fr" src="https://flagcdn.com/w80/fr.png" alt="Français" title="Français"
      role="button" tabindex="0" data-lang="fr" aria-pressed="false">
    <img class="flag flag-es" src="https://flagcdn.com/w80/es.png" alt="Español" title="Español"
      role="button" tabindex="0" data-lang="es" aria-pressed="false">
  </div>

  <!-- Navigation revealed after language selection -->
  <nav class="lang-nav" id="main-nav" aria-label="Site navigation" aria-hidden="true">
    <div class="nav-row">
      <a href="/spirituality" id="nav-spirituality">Spirituality</a>
      <span class="nav-sep" aria-hidden="true">—</span>
      <a href="/newthought"   id="nav-newthought">New Thought</a>
      <span class="nav-sep" aria-hidden="true">—</span>
      <a href="/philosophy"   id="nav-philosophy">Philosophy</a>
    </div>
    <div class="nav-row">
      <a href="/novels"     id="nav-novels">Novels</a>
      <span class="nav-sep" aria-hidden="true">—</span>
      <a href="/psychology" id="nav-psychology">Psychology</a>
      <span class="nav-sep" aria-hidden="true">—</span>
      <a href="/economy"    id="nav-economy">Economy</a>
    </div>
  </nav>

  <script>
    const LANGS = {
      en: {
        spirituality: 'Spirituality',   newthought: 'New Thought',  philosophy: 'Philosophy',
        novels:       'Novels',         psychology: 'Psychology',    economy:    'Economy',
        spiritualityHref: '/spirituality', newthoughtHref: '/newthought', philosophyHref: '/philosophy',
        novelsHref:       '/novels',       psychologyHref: '/psychology', economyHref:    '/economy',
        htmlLang: 'en',
        tagline: 'Ancient wisdom · Timeless collection',
      },
      fr: {
        spirituality: 'Spiritualité',   newthought: 'Nouvelle Pensée', philosophy: 'Philosophie',
        novels:       'Romans',         psychology: 'Psychologie',     economy:    'Économie',
        spiritualityHref: '/spiritualite', newthoughtHref: '/nouvelle-pensee', philosophyHref: '/philosophie',
        novelsHref:       '/romans',       psychologyHref: '/psychologie',     economyHref:    '/economie',
        htmlLang: 'fr',
        tagline: 'Sagesse ancienne · Collection intemporelle',
      },
      es: {
        spirituality: 'Espiritualidad', newthought: 'Nuevo Pensamiento', philosophy: 'Filosofía',
        novels:       'Novelas',        psychology: 'Psicología',        economy:    'Economía',
        spiritualityHref: '/espiritualidad', newthoughtHref: '/biblioteca-atkinson.html', philosophyHref: '/filosofia',
        novelsHref:       '/biblioteca-verne.html', psychologyHref: '/psicologia', economyHref: '/economia',
        htmlLang: 'es',
        tagline: 'Sabiduría antigua · Colección intemporal',
      },
    };

    const spiral          = document.querySelector('.spiral-svg');
    const nav             = document.getElementById('main-nav');
    const navSpirituality = document.getElementById('nav-spirituality');
    const navNewthought   = document.getElementById('nav-newthought');
    const navPhilosophy   = document.getElementById('nav-philosophy');
    const navNovels       = document.getElementById('nav-novels');
    const navPsychology   = document.getElementById('nav-psychology');
    const navEconomy      = document.getElementById('nav-economy');
    const flags           = document.querySelectorAll('.flag');
    const taglineEl       = document.getElementById('brand-tagline');

    let activeLang = null;

    function selectLanguage(lang) {
      const c = LANGS[lang];
      if (!c) return;
      activeLang = lang;

      flags.forEach(f => {
        const on = f.dataset.lang === lang;
        f.classList.toggle('active', on);
        f.setAttribute('aria-pressed', on ? 'true' : 'false');
      });

      navSpirituality.textContent = c.spirituality;  navSpirituality.href = c.spiritualityHref;
      navNewthought.textContent   = c.newthought;    navNewthought.href   = c.newthoughtHref;
      navPhilosophy.textContent   = c.philosophy;    navPhilosophy.href   = c.philosophyHref;
      navNovels.textContent       = c.novels;        navNovels.href       = c.novelsHref;
      navPsychology.textContent   = c.psychology;    navPsychology.href   = c.psychologyHref;
      navEconomy.textContent      = c.economy;       navEconomy.href      = c.economyHref;
      document.documentElement.lang = c.htmlLang;

      spiral.classList.add('hidden');
      nav.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => requestAnimationFrame(() => nav.classList.add('visible')));
    }

    function resetLanguage() {
      activeLang = null;
      document.documentElement.lang = 'en';
      flags.forEach(f => { f.classList.remove('active'); f.setAttribute('aria-pressed', 'false'); });
      spiral.classList.remove('hidden');
      nav.classList.remove('visible');
      nav.setAttribute('aria-hidden', 'true');
    }

    flags.forEach(flag => {
      flag.addEventListener('click', () => selectLanguage(flag.dataset.lang));
      flag.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectLanguage(flag.dataset.lang); }
      });
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape' && activeLang) resetLanguage(); });

    // Rotating tagline
    const taglines = [
      'Ancient wisdom · Timeless collection',
      'Sagesse ancienne · Collection intemporelle',
      'Sabiduría antigua · Colección intemporal',
    ];
    let taglineIndex = 0;
    setInterval(() => {
      taglineEl.classList.add('fading');
      setTimeout(() => {
        taglineIndex = (taglineIndex + 1) % taglines.length;
        taglineEl.textContent = taglines[taglineIndex];
        taglineEl.classList.remove('fading');
      }, 350);
    }, 3000);

    // Arrow key navigation between flags
    flags.forEach((flag, i) => {
      flag.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault(); flags[(i + 1) % flags.length].focus();
        }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault(); flags[(i - 1 + flags.length) % flags.length].focus();
        }
      });
    });
  </script>

</body>
</html>
